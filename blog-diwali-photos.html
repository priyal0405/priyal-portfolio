<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diwali Photos · Priyal Jain</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header class="page-header intro photos-header">
      <a href="blog.html" class="back">← Back to the blog</a>
      <p class="subtitle">School Diwali celebration · 6 November 2026</p>
      <h1>Diwali Photos</h1>
    </header>

    <!--
      To add a photo: copy one <figure> block, change the image file, alt text and caption.
      Click any photo to see it enlarged (zoom.js).
    -->
    <section class="photo-grid">
      <figure class="card photo-card">
        <img src="images/diwali-2026-ready-outside.jpg" alt="Priyal in a light blue lehenga with mehendi, standing outside among potted plants">
        <figcaption>Hair: 20 minutes. Patience: gone.</figcaption>
      </figure>
      <figure class="card photo-card">
        <img src="images/diwali-2026-sultan.jpg" alt="Priyal sitting on the floor in her lehenga beside her big black dog, Sultan">
        <figcaption>Sultan was not consulted about the outfit</figcaption>
      </figure>
      <figure class="card photo-card">
        <img src="images/diwali-2026-sultan-2.jpg" alt="Priyal sitting on the sofa in her lehenga next to Sultan">
        <figcaption>He's still judging</figcaption>
      </figure>
      <figure class="card photo-card">
        <img src="images/diwali-2026-school-gate.jpg" alt="Priyal and friends in festive outfits at the school gate">
        <figcaption>Arriving like it's a red carpet</figcaption>
      </figure>
      <figure class="card photo-card">
        <img src="images/diwali-2026-twirl.jpg" alt="Priyal and a friend striking a pose with arms outstretched in the classroom">
        <figcaption>Auditioning for a Bollywood film</figcaption>
      </figure>
      <figure class="card photo-card">
        <img src="images/diwali-2026-trio-2.jpg" alt="Priyal with two friends in maroon and light blue outfits">
        <figcaption>Three people, one shared brain cell</figcaption>
      </figure>
      <figure class="card photo-card">
        <img src="images/diwali-2026-friend-pink.jpg" alt="Priyal with a friend in a mauve outfit">
        <figcaption>Photo #47 of 300</figcaption>
      </figure>
      <figure class="card photo-card">
        <img src="images/diwali-2026-friend-red.jpg" alt="Priyal with a friend in a red outfit">
        <figcaption>Posing like the cake isn't waiting</figcaption>
      </figure>
      <figure class="card photo-card">
        <img src="images/diwali-2026-friend-maroon.jpg" alt="Priyal with a friend in a maroon outfit">
        <figcaption>Photo #112. Still smiling.</figcaption>
      </figure>
      <figure class="card photo-card">
        <img src="images/diwali-2026-peace.jpg" alt="Priyal and a friend making peace signs">
        <figcaption>Peace ✌ (the cake fight hadn't started yet)</figcaption>
      </figure>
      <figure class="card photo-card">
        <img src="images/diwali-2026-friend-blue.jpg" alt="Priyal with a friend in a light blue kurta">
        <figcaption>Matching blues, completely by accident</figcaption>
      </figure>
      <figure class="card photo-card">
        <img src="images/diwali-2026-four-friends.jpg" alt="Priyal with three friends in festive outfits">
        <figcaption>Four people, zero plans</figcaption>
      </figure>
      <figure class="card photo-card">
        <img src="images/diwali-2026-girls-sitting.jpg" alt="A group of girls from the class posing together in festive outfits">
        <figcaption>Everyone fit in the frame. A Diwali miracle.</figcaption>
      </figure>
      <figure class="card photo-card">
        <img src="images/diwali-2026-girls-standing.jpg" alt="A group of girls from the class standing together in festive outfits">
        <figcaption>Group photo, take 27</figcaption>
      </figure>
      <figure class="card photo-card">
        <img src="images/diwali-2026-girls-group.jpg" alt="Another group of girls from the class posing together">
        <figcaption>Group photo, take 28</figcaption>
      </figure>
      <figure class="card photo-card">
        <img src="images/diwali-2026-with-teacher.jpg" alt="A group of students with their class teacher in the classroom">
        <figcaption>The photographer finally gets in the picture</figcaption>
      </figure>
      <figure class="card photo-card">
        <img src="images/diwali-2026-class.jpg" alt="The whole class posing together in festive outfits">
        <figcaption>The whole class, minus the cake</figcaption>
      </figure>
      <figure class="card photo-card">
        <img src="images/diwali-2026-selfie.jpg" alt="A close-up selfie of a group of friends laughing">
        <figcaption>Who's holding the phone? Nobody knows.</figcaption>
      </figure>
    </section>
  </main>
  <script src="zoom.js"></script>
</body>
</html>
